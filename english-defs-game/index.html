<!doctype html>
<html lang="en" data-reading-theme="warm-light" data-reading-font="standard" data-reading-size="standard" data-reading-motion="standard">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('wordquest-reading-settings') || 'null')
        var root = document.documentElement
        if (stored && typeof stored === 'object') {
          if (stored.textSize === 'standard' || stored.textSize === 'large') {
            root.setAttribute('data-reading-size', stored.textSize)
          }
          if (
            stored.theme === 'warm-light' ||
            stored.theme === 'dark' ||
            stored.theme === 'high-contrast'
          ) {
            root.setAttribute('data-reading-theme', stored.theme)
          }
          if (stored.font === 'standard' || stored.font === 'clear') {
            root.setAttribute('data-reading-font', stored.font)
          }
          if (stored.motion === 'standard' || stored.motion === 'reduced') {
            root.setAttribute('data-reading-motion', stored.motion)
          }
        }
      } catch {
        /* keep defaults */
      }
    </script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500,
      })
      try {
        if (localStorage.getItem('wordquest-cookie-consent') === 'granted') {
          gtag('consent', 'update', { analytics_storage: 'granted' })
        }
      } catch {
        /* ignore */
      }
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DYCTEEENZG"></script>
    <script>
      gtag('js', new Date())
      gtag('config', 'G-DYCTEEENZG', { anonymize_ip: true })
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WordQuest — an English vocabulary game for middle school students. Unscramble definitions and pick the right meaning."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>WordQuest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
